name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/app backend/eval

  test:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt --break-system-packages
      - run: pip install pytest --break-system-packages
      - name: Lancer les tests (aucune clé API réelle nécessaire, LLM mocké)
        working-directory: backend
        env:
          GROQ_API_KEY: "dummy-key-for-ci"
        run: pytest tests/ -v

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build l'image du backend (vérifie juste que ça build, pas de push)
        run: docker build -t agentic-research-copilot-backend:ci ./backend
